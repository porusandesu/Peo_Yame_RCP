<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#112821"><title>Peo Yame</title>
<style>
:root{font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;color:#14231b;background:#f1f6f2;--green:#176b4d;--dark:#0f4a35;--header:#112821;--line:#dde6df;--muted:#5c6e64;--pale:#e1f0e6}
*{box-sizing:border-box}body{margin:0}button,input,select{font:inherit}button{min-height:48px;border:0;border-radius:12px;padding:11px 16px;background:#eaf0ec;color:#14231b;cursor:pointer;font-weight:650}button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #78aa91;outline-offset:2px}.primary{background:var(--green);color:white}.danger{background:#fff0ed;color:#a12e23}.wrap{max-width:1120px;margin:auto;padding:0 22px}header{background:var(--header);color:white}.head{height:74px;display:flex;align-items:center;justify-content:space-between}.brand{display:flex;align-items:center;gap:12px;font-size:21px;font-weight:750}.brand img{width:44px;height:44px;object-fit:contain;border-radius:10px;background:white;padding:4px}.sync{font-size:13px;color:#d8e5dd}main{padding:26px 0 60px}.entry{min-height:calc(100vh - 74px);display:grid;place-items:center}.box,.card{background:white;border:1px solid var(--line);border-radius:18px;padding:20px;box-shadow:0 3px 14px #11282108;margin-bottom:14px}.box{width:min(520px,100%)}h1{font-size:28px;letter-spacing:-.03em;margin:0 0 18px}h2{font-size:18px;margin:0 0 12px}.muted{color:var(--muted);line-height:1.55}.stack{display:grid;gap:10px}.field label{display:block;font-weight:650;margin:8px 0 5px}.field input,.field select,input,select{min-height:46px;border:1px solid #a9b8ae;border-radius:10px;padding:10px;width:100%;background:white}.row{display:flex;align-items:center;justify-content:space-between;gap:12px}.tabs{display:flex;background:#fff;position:sticky;top:0;z-index:2;border-bottom:1px solid var(--line);gap:8px;padding:8px 0}.tabs button{background:transparent;color:#385b4d}.tabs button.active{color:var(--green);border-bottom:3px solid var(--green);border-radius:0}.pill{display:inline-flex;border-radius:99px;padding:6px 10px;background:var(--pale);color:var(--dark);font-size:13px;font-weight:650}.notice{border-left:4px solid #6d9b7c;background:#f0f6f1;border-radius:9px;padding:14px;margin:10px 0}.banner{background:#fff3d6;border-left-color:#9b761d}.ggrid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.gauge{background:#fbfdfb;border:1px solid var(--line);border-radius:15px;padding:16px;text-align:center}.ring{--v:55%;width:116px;height:116px;margin:8px auto 12px;border-radius:50%;background:conic-gradient(var(--green) var(--v),#e6ede8 0);display:grid;place-items:center;position:relative}.ring:before{content:"";position:absolute;inset:9px;border-radius:50%;background:white}.value{position:relative;font-size:22px;font-weight:750}.ticks{display:flex;justify-content:space-between;color:var(--muted);font-size:12px;margin-top:8px}.estimate{border-left:4px solid #90ab98}.estimate .value{font-size:27px;color:var(--dark);margin:9px 0}.actions{display:flex;gap:8px;flex-wrap:wrap}.list{display:grid;gap:10px}.item{border:1px solid var(--line);border-radius:14px;padding:15px;background:#fff}.chart{width:100%;height:auto;display:block}.hide{display:none!important}
@media(max-width:767px){.wrap{padding:0 14px}main{padding:19px 0 94px}.tabs{position:fixed;inset:auto 0 0;display:grid;grid-template-columns:repeat(5,1fr);gap:0;padding:5px 4px calc(5px + env(safe-area-inset-bottom));box-shadow:0 -3px 14px #11282114}.tabs button{font-size:11px;padding:5px 1px;min-height:54px}.tabs button.active{border:0;border-top:3px solid var(--green)}.card{padding:16px}.head{height:66px}.ggrid{gap:9px}}
@media(max-width:360px){.ggrid{grid-template-columns:1fr}}
</style></head><body>
<header><div class="wrap head"><div class="brand"><img src="/assets/peo-yame-512.png" alt=""><span>Peo Yame</span></div><span class="sync" id="sync">Not synced</span></div></header>
<main class="wrap">
<section id="gate" class="entry"><div class="box"><h1>Welcome to Peo Yame</h1><p class="muted">Storage conditions, clearly monitored.</p><div class="stack"><button class="primary" onclick="startInstant()">Explore Demo mode</button><button onclick="showAuth('login')">Sign in</button><button onclick="showAuth('register')">Create account</button><button onclick="startWebQr()">Sign in with QR code</button><div id="webqr"></div><div class="notice">Instant Demo uses shared simulated readings. It creates no account and needs no sign-in.</div><div id="auth" class="hide stack"></div></div></div></section>
<section id="app" class="hide"><nav class="tabs" id="tabs"></nav><div id="banner"></div><div id="screen"></div></section>
</main>
<script>
const pages=["Overview","Trends","My Crops","Alerts","Settings"];let page="Overview",mode="instant",token=null,crop="Maize",offline=false,lastSynced=null,sites=[],alerts=[],trendRange="24h";
const $=s=>document.querySelector(s),api=async(path,opt={})=>{const headers={"content-type":"application/json",...(opt.headers||{})};if(token)headers.authorization="Bearer "+token;const res=await fetch("/api"+path,{...opt,headers});let data={};try{data=await res.json()}catch{}if(!res.ok)throw Error(data.error||"Request failed");return data};
function showAuth(which){const a=$("#auth");a.classList.remove("hide");a.innerHTML=which==="register"?'<div class="field"><label>Name</label><input id="name" autocomplete="name"></div><div class="field"><label>Phone number</label><input id="phone" placeholder="+267 7X XXX XXX" autocomplete="tel"></div><div class="field"><label>Password</label><input id="password" type="password" autocomplete="new-password"></div><button class="primary" onclick="register()">Create account</button>':'<div class="field"><label>Phone number</label><input id="phone" placeholder="+267 7X XXX XXX" autocomplete="tel"></div><div class="field"><label>Password</label><input id="password" type="password" autocomplete="current-password"></div><button class="primary" onclick="login()">Sign in</button>';a.insertAdjacentHTML("beforeend",'<p id="error" class="muted"></p>')}
async function register(){try{const d=await api("/account/register",{method:"POST",body:JSON.stringify({name:$("#name").value,phone:$("#phone").value,password:$("#password").value})});token=d.token;mode="farmer";enter()}catch(e){$("#error").textContent=e.message}}
async function login(){try{const d=await api("/account/login",{method:"POST",body:JSON.stringify({phone:$("#phone").value,password:$("#password").value})});token=d.token;mode="farmer";enter()}catch(e){$("#error").textContent=e.message}}
async function startWebQr(){try{const bytes=crypto.getRandomValues(new Uint8Array(32));const verifier=Array.from(bytes,x=>x.toString(16).padStart(2,"0")).join("");const digest=await crypto.subtle.digest("SHA-256",new TextEncoder().encode(verifier));const verifierHash=Array.from(new Uint8Array(digest),x=>x.toString(16).padStart(2,"0")).join("");const d=await api("/qr/web/create",{method:"POST",body:JSON.stringify({verifierHash})});const box=document.createElement("div"),img=document.createElement("img"),label=document.createElement("p");box.className="card";img.src=d.qrDataUrl;img.alt="Sign-in QR code";img.width=220;label.textContent="Match code "+d.matchCode+" · expires in 90 seconds";box.append(img,label);$("#webqr").replaceChildren(box);let n=0;const timer=setInterval(async()=>{if(++n>75){clearInterval(timer);$("#webqr").textContent="This code expired. Get a new one.";return}try{const state=await api("/qr/web/status?codeId="+encodeURIComponent(d.codeId)+"&verifier="+encodeURIComponent(verifier));if(state.state==="approved"){clearInterval(timer);const session=await api("/qr/web/redeem",{method:"POST",body:JSON.stringify({codeId:d.codeId,verifier})});token=session.token;mode="farmer";await enter();banner("Signed in as "+session.user.name)}else if(state.state==="denied"){clearInterval(timer);$("#webqr").textContent="This request was denied."}}catch(e){}},1200)}catch(e){$("#webqr").textContent=e.message}}
async function connectPhone(){try{const d=await api("/qr/phone/create",{method:"POST",body:"{}"});const box=document.createElement("div"),img=document.createElement("img"),info=document.createElement("p"),state=document.createElement("p");box.className="card";img.src=d.qrDataUrl;img.alt="Connect phone QR code";img.width=220;info.textContent="Works once · expires in 90 seconds. Phone and computer must be on the same Wi-Fi.";state.textContent="Waiting for a phone to scan.";box.append(img,info,state);$("#phone-qr").replaceChildren(box);let n=0,handled=false;const timer=setInterval(async()=>{if(++n>75){clearInterval(timer);state.textContent="This code expired. Get a new one.";return}try{const p=await api("/qr/phone/owner-status?codeId="+encodeURIComponent(d.codeId));if(p.state==="scanned"&&!handled){handled=true;const number=prompt("Approve phone sign-in from "+p.deviceName+" · "+p.appVersion+" · "+p.address+". Enter the number shown on your phone.");if(number===null){await api("/qr/phone/deny",{method:"POST",body:JSON.stringify({codeId:d.codeId})});clearInterval(timer);return}await api("/qr/phone/approve",{method:"POST",body:JSON.stringify({codeId:d.codeId,matchCode:number})});state.textContent="Phone approved. Waiting for connection."}else if(p.state==="completed"){clearInterval(timer);state.textContent="Phone connected."}else if(p.state==="denied"||p.state==="expired"){clearInterval(timer);state.textContent=p.state==="denied"?"This request was denied.":"This code expired. Get a new one."}}catch(e){}},1000)}catch(e){alert(e.message)}}
async function startInstant(){mode="instant";token=null;enter()}
async function enter(){ $("#gate").classList.add("hide");$("#app").classList.remove("hide");render();await refresh();}
function render(){ $("#tabs").innerHTML=pages.map(x=>'<button class="'+(page===x?'active':'')+'" onclick="page='+JSON.stringify(x)+';render();refresh()">'+x+'</button>').join(""); const content={
"Overview":'<h1>Overview</h1><section class="card"><div class="row"><span class="pill" id="status">Loading status</span><span class="muted" id="crop-status">Target-band status</span></div><div class="ggrid"><div class="gauge"><div class="ring" id="tr"><div class="value" id="temp">— °C</div></div><b>Temperature</b><div class="ticks"><span>Low</span><span>Target band</span><span>High</span></div></div><div class="gauge"><div class="ring" id="hr"><div class="value" id="humidity">— %</div></div><b>Humidity</b><div class="ticks"><span>Low</span><span>Target band</span><span>High</span></div></div></div></section><section class="card estimate"><div class="row"><b>Rough storage estimate</b><span class="pill">Estimate</span></div><div class="value" id="estimate">Loading estimate</div><p class="muted">A rough guess from temperature and humidity only. It does not inspect your crop. Check your crops by hand every few days.</p><p class="muted">Estimate only. Not a measurement.</p><button onclick="alert(\'This unvalidated estimate uses the distance from crop temperature and humidity target-band midpoints. It ignores crop moisture, variety, maturity, pests, packaging, ventilation and time already stored.\')">How is this estimated?</button></section><section class="card"><h2>Selected crop</h2><select id="crop" onchange="crop=this.value;refresh()"><option>Maize</option><option>Sorghum</option><option>Tomato</option><option>Potato</option><option>Beans</option><option>Rice</option><option>Wheat</option><option>Groundnuts</option><option>Cowpeas</option><option>Millet</option></select></section>',
"Trends":'<h1>Trends</h1><section class="card"><div class="actions"><button onclick="trendRange=\'24h\';refreshTrends()">24 hours</button><button onclick="trendRange=\'month\';refreshTrends()">1 month</button><button onclick="trendRange=\'3months\';refreshTrends()">3 months</button></div><h2>Temperature (°C)</h2><div id="tc" class="muted">Loading readings</div><h2>Humidity (%)</h2><div id="hc" class="muted">Loading readings</div></section>',
"My Crops":'<h1>My Crops</h1><div id="sites" class="list"></div><section class="card"><h2>Add storage location</h2><div class="field"><label>Location name</label><input id="site-name"></div><div class="field"><label>Crop</label><select id="site-crop"><option>Maize</option><option>Sorghum</option><option>Tomato</option><option>Potato</option></select></div><button class="primary" onclick="addSite()">Add location</button></section>',
"Alerts":'<h1>Alerts</h1><div class="notice">This alert log records simulated messages. SMS is not sent.</div><div id="alerts" class="list"></div>',
"Settings":'<h1>Settings</h1><section class="card"><h2>Account and security</h2><button onclick="loadAccount()">Profile</button><div id="account" class="muted"></div><button onclick="loadSessions()">Active sessions</button><div id="sessions"></div><h2>Other devices</h2><button onclick="connectPhone()">Connect phone by QR</button><div id="phone-qr"></div><h2>Backend connection</h2><p class="muted">Connected to this Peo Yame backend. HTTP is intended for a controlled demo Wi-Fi network.</p></section><section class="card"><h2>Demo tools</h2><p class="muted">Demo-only actions use simulated data.</p><div class="actions"><button onclick="startGuided()">Start guided demo</button><button onclick="breach()">Simulate breach</button><button onclick="switchCrop()">Switch crop</button><button onclick="resetDemo()">Reset demo</button><button onclick="simulateOffline()">Simulate network loss</button></div><button onclick="signout()">Sign out</button></section>'
};$("#screen").innerHTML=content[page]; if(page==="Trends")refreshTrends();if(page==="My Crops")loadSites();if(page==="Alerts")loadAlerts()}
function banner(msg,warning=false){$("#banner").innerHTML=msg?'<div class="notice '+(warning?'banner':'')+'">'+msg+'</div>':""}
async function refresh(){if(offline){banner("Offline. Values may be out of date.",true);return}try{const d=await api("/status?crop="+encodeURIComponent(crop));lastSynced=d.lastSyncedAt;$("#sync").textContent="Last synced "+new Date(lastSynced).toLocaleTimeString();$("#status").textContent=d.statusLabel;$("#temp").textContent=d.reading?Number(d.reading.temperature).toFixed(1)+" °C":"— °C";$("#humidity").textContent=d.reading?Number(d.reading.humidity).toFixed(0)+" %":"— %";const bands=d.targetBands; if(d.reading){$("#tr").style.setProperty("--v",Math.max(5,Math.min(100,(d.reading.temperature-bands.temperatureC[0])/(bands.temperatureC[1]-bands.temperatureC[0])*100))+"%");$("#hr").style.setProperty("--v",Math.max(5,Math.min(100,(d.reading.humidity-bands.humidityPercent[0])/(bands.humidityPercent[1]-bands.humidityPercent[0])*100))+"%")}$("#estimate").textContent=d.estimate?"About "+d.estimate.rangeWeeks[0]+"–"+d.estimate.rangeWeeks[1]+" weeks":"Estimate not available while readings are old";$("#crop-status").textContent=d.dataLabel==="simulated readings"?"Demo data · simulated":d.stale?"Last reading is old":"Target-band reading";banner(d.stale?"Offline or old reading. Last reading: "+(d.reading?.createdAt||"not available"):d.statusLabel==="Outside target band"?"Conditions are outside the target band. Check your crop now.":"")}catch(e){banner("Backend unreachable. Values may be out of date.",true)}}
function chart(points,key,band,color){const w=700,h=210,p=20,vals=points.map(x=>Number(x[key])).filter(Number.isFinite),lo=Math.min(band[0]-3,...vals),hi=Math.max(band[1]+3,...vals),xy=points.map((x,i)=>[p+i*(w-2*p)/Math.max(1,points.length-1),h-p-(Number(x[key])-lo)*(h-2*p)/(hi-lo)]);return '<svg class="chart" viewBox="0 0 700 210" role="img" aria-label="Readings and target band"><rect x="'+p+'" y="'+(h-p-(band[1]-lo)*(h-2*p)/(hi-lo))+'" width="'+(w-2*p)+'" height="'+((band[1]-band[0])*(h-2*p)/(hi-lo))+'" fill="'+color+'" opacity=".12"/><polyline fill="none" stroke="#176b4d" stroke-width="3" points="'+xy.map(a=>a.join(",")).join(" ")+'"/></svg>'}
async function refreshTrends(){try{const [d,s]=await Promise.all([api("/readings/trends?range="+trendRange),api("/status?crop="+encodeURIComponent(crop))]);$("#tc").innerHTML=chart(d.points,"temperature",s.targetBands.temperatureC,"#176b4d");$("#hc").innerHTML=chart(d.points,"humidity",s.targetBands.humidityPercent,"#2f5fbf")}catch(e){$("#tc").textContent=e.message}}
async function loadSites(){try{sites=await api("/sites");$("#sites").innerHTML=sites.map(x=>'<article class="item"><b>'+esc(x.name)+'</b><p>'+esc(x.crop)+' · Account data</p><button class="danger" onclick="removeSite('+JSON.stringify(x.id)+')">Delete location</button></article>').join("")||'<div class="card">No locations yet. Add a storage location below.</div>'}catch(e){$("#sites").textContent=e.message}}
async function addSite(){try{await api("/sites",{method:"POST",body:JSON.stringify({name:$("#site-name").value,crop:$("#site-crop").value})});loadSites()}catch(e){alert(e.message)}}
async function removeSite(id){await api("/sites/"+encodeURIComponent(id),{method:"DELETE"});loadSites()}
async function loadAlerts(){try{alerts=await api("/alerts");$("#alerts").innerHTML=alerts.map(x=>'<article class="item"><b>'+esc(x.message)+'</b><p>'+new Date(x.created_at).toLocaleString()+' · simulated alert</p><button onclick="api(\'/alerts/'+encodeURIComponent(x.id)+'\',{method:\'PATCH\'}).then(loadAlerts)">Mark reviewed</button></article>').join("")||'<div class="card">No alerts.</div>'}catch(e){$("#alerts").textContent=e.message}}
async function loadAccount(){try{const a=await api("/account");$("#account").textContent=a.name+" · "+a.phone+(a.isDemo?" · Demo session":"")}catch(e){$("#account").textContent=e.message}}
async function loadSessions(){$("#sessions").textContent="Active session details will appear here."}
async function startGuided(){try{const d=await api("/demo/start",{method:"POST",body:"{}"});token=d.token;mode="guided";page="Overview";render();refresh();banner("Demo session. Data is simulated and will be deleted.");}catch(e){alert(e.message)}}
async function breach(){try{await api("/demo/breach",{method:"POST"});refresh();alert("Simulated out-of-band readings recorded.")}catch(e){alert(e.message)}}
function switchCrop(){crop=crop==="Maize"?"Sorghum":"Maize";if(page==="Overview")render();refresh()}
async function resetDemo(){if(!confirm("Reset this guided demo and delete its temporary account and data?"))return;try{await api("/demo/reset",{method:"POST"});token=null;mode="instant";$("#app").classList.add("hide");$("#gate").classList.remove("hide")}catch(e){alert(e.message)}}
function simulateOffline(){offline=!offline;banner(offline?"Offline simulation is on for this browser.":"Network simulation ended.",offline);if(!offline)refresh()}
async function signout(){try{await api("/account/logout",{method:"POST"})}catch{}token=null;$("#app").classList.add("hide");$("#gate").classList.remove("hide")}
function esc(s){return String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]))}
setInterval(()=>{if(!$("#app").classList.contains("hide")){refresh();if(page==="Trends")refreshTrends()}},30000);
</script></body></html>
