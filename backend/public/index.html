<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Peo Yame</title><style>
:root{font-family:Inter,system-ui,sans-serif;color:#183d30;background:#f5f7f3;--green:#245f49;--line:#768a80}*{box-sizing:border-box}body{margin:0}header{background:#193d30;color:white;padding:18px 28px;display:flex;justify-content:space-between}.brand{font-size:22px;font-weight:700}.chip{border-radius:99px;padding:7px 12px;background:#d9eadf;color:#245f49;font-size:13px}nav{display:flex;gap:8px;padding:16px 28px;background:white;border-bottom:1px solid #d8e0da}button{border:0;border-radius:10px;padding:12px 16px;font:inherit;cursor:pointer}nav button{background:transparent;color:#315747}nav button.active,.primary{background:var(--green);color:white}main{max-width:1050px;margin:28px auto;padding:0 20px}.card{background:white;border:1px solid #e1e7e1;border-radius:18px;padding:22px;margin-bottom:16px}h1{font-size:32px;margin:0 0 18px}.metrics{display:grid;grid-template-columns:1fr 1fr;gap:14px}.metric{font-size:34px;font-weight:700;margin-top:10px}.note{color:#52695e;line-height:1.55}.estimate{border-left:4px solid #91ae9c}.actions{display:flex;gap:10px;flex-wrap:wrap}@media(max-width:767px){nav{overflow:auto;padding:10px}nav button{white-space:nowrap}.metrics{grid-template-columns:1fr}}
</style></head><body><header><div class="brand">Peo Yame</div><span class="chip">Demo data · simulated</span></header><nav id="tabs"></nav><main id="view"></main><script>
const pages=["Overview","Trends","My Crops","Alerts","Settings"];let selected="Overview";
const tabs=document.querySelector("#tabs"),view=document.querySelector("#view");
function render(){tabs.innerHTML=pages.map(x=>'<button class="'+(selected===x?'active':'')+'" data-page="'+x+'">'+x+'</button>').join("");tabs.querySelectorAll("button").forEach(b=>b.onclick=()=>{selected=b.dataset.page;render()});
const c={"Overview":'<h1>Overview</h1><section class="card"><span class="chip">In range</span><p class="note">Within configured limits. This does not mean the crop is safe.</p><div class="metrics"><div>Temperature<div class="metric">18.2 °C</div><small>Low · Target · High</small></div><div>Humidity<div class="metric">62 %</div><small>Low · Target · High</small></div></div></section><section class="card estimate"><b>Rough storage estimate</b> <span class="chip">Estimate</span><div class="metric">About 3–5 weeks</div><p class="note">A rough guess from temperature and humidity only. It does not inspect your crop. Check your crops by hand every few days.</p><button>I checked my crop</button> <button>How is this estimated?</button></section>',
"Trends":'<h1>Trends</h1><section class="card"><button>24 hours</button> <button>1 month</button> <button>3 months</button><h2>Temperature (°C)</h2><h2>Humidity (%)</h2>Threshold bands</section>',
"My Crops":'<h1>My Crops</h1><section class="card">0 storage locations · 0 sensors linked</section><section class="card">No storage locations yet</section><button class="primary">Add storage location</button>',
"Alerts":'<h1>Alerts</h1><section class="card">Alert log. Text messages are not sent in this edition.</section>',
"Settings":'<h1>Settings</h1><section class="card">Account & security · Profile · Authenticator · Active sessions<br>Connection · Backend address · Last synced<br>Other devices · Log in on computer<br>Data · Export readings<br>Demo tools · Reset demo</section><div class="actions"><button>Explore Demo mode</button><button>Start guided demo</button><button>Sign out</button></div>'};
view.innerHTML=c[selected];}render();
</script></body></html>
