<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Peo Yame</title>
<style>
:root{font-family:Inter,Arial,sans-serif;color:#173d30;background:#f4f7f3;--brand:#245f49;--soft:#e4efe8;--line:#768a80;--ink:#183d30;--muted:#536a60;--warning:#945b12}
*{box-sizing:border-box}body{margin:0}button,input,select{font:inherit}button{border:0;border-radius:10px;padding:12px 16px;cursor:pointer;background:#e7eee8;color:var(--ink)}button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #78aa91;outline-offset:2px}.primary{background:var(--brand);color:white}.secondary{background:#e4efe8;color:var(--brand)}.tertiary{background:transparent;color:var(--brand);text-decoration:underline}.danger{border:1px solid #9a5148;background:white;color:#8b342b}.wrap{max-width:1120px;margin:auto;padding:0 24px}
header{background:#193d30;color:white;padding:14px 0}.head{display:flex;align-items:center;justify-content:space-between}.brand{display:flex;align-items:center;gap:10px;font-size:21px;font-weight:700}.brand img{width:38px;height:38px;border-radius:8px;background:white;padding:3px}.chips{display:flex;gap:8px;align-items:center}.chip{display:inline-flex;align-items:center;gap:6px;border-radius:99px;background:var(--soft);color:var(--brand);padding:7px 11px;font-size:13px}.chip:before{content:"●";font-size:10px}.sync{font-size:13px;color:#dbe8df}
nav{display:flex;gap:8px;padding:12px 0;border-bottom:1px solid #d9e1da;background:#fff;position:sticky;top:0;z-index:2}nav button{background:transparent;color:#385b4d}nav button.active{color:var(--brand);border-bottom:3px solid var(--brand);border-radius:0;font-weight:700}
main{padding:24px 0 60px}h1{font-size:30px;margin:0 0 18px}h2{font-size:18px;margin:0 0 12px}.card{background:white;border:1px solid #e0e7e1;border-radius:18px;padding:20px;margin-bottom:14px;box-shadow:0 3px 14px #143b2b08}.row{display:flex;gap:14px;align-items:center;justify-content:space-between}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.metric{font-size:32px;font-weight:700;margin:8px 0}.muted{color:var(--muted);line-height:1.55}.notice{background:#edf4ee;border-left:4px solid #6e9f7e;padding:14px;border-radius:9px}.estimate{border-left:4px solid #90ab98}.estimate .metric{font-size:28px}.actions{display:flex;gap:9px;flex-wrap:wrap}.fields{max-width:440px}.fields label{display:block;font-weight:600;margin-top:12px}.fields input,.fields select{width:100%;padding:12px;border:1px solid var(--line);border-radius:9px;background:white}.error{color:#8b342b;min-height:24px}.entry{min-height:calc(100vh - 72px);display:grid;place-items:center}.entrybox{width:min(520px,100%);padding:32px}.entrybox h1{line-height:1.2}.entrybuttons{display:grid;gap:10px;margin-top:22px}.hide{display:none!important}.search{margin:10px 0}.list{display:grid;gap:10px}.sensor{display:flex;justify-content:space-between;padding:8px 0;border-top:1px solid #edf0ed}
@media(max-width:767px){.wrap{padding:0 16px}.head{align-items:flex-start}.sync{display:none}nav{justify-content:space-between;overflow:auto}nav button{padding:10px 8px;white-space:nowrap}.grid{grid-template-columns:1fr}main{padding-top:18px}.entrybox{padding:24px}.chips{align-items:flex-end;flex-direction:column}}
</style></head><body>
<header><div class="wrap head"><div class="brand"><img src="/peoyame-logo.png" alt=""><span>Peo Yame</span></div><div class="chips"><span id="label" class="chip">Demo data · simulated</span><span id="sync" class="sync">Last synced: not yet</span></div></div></header>
<div id="entry" class="wrap entry"><section class="card entrybox"><div class="chip">Storage monitoring</div><h1>Welcome to<br>Peo Yame</h1><p class="muted">Monitor storage conditions and check your crops by hand.</p><div id="entry-error" class="error" role="alert"></div>
<div class="entrybuttons"><button class="primary" onclick="showAuth('login')">Sign in</button><button class="secondary" onclick="showAuth('register')">Create account</button><button class="tertiary" onclick="instantDemo()">Explore Demo mode</button></div>
<div class="notice muted" style="margin-top:16px">Demo mode uses simulated readings and creates no account.</div>
<div class="fields hide" id="authform"></div></section></div>
<div id="application" class="hide"><div class="wrap"><nav id="tabs"></nav></div><main class="wrap" id="view"></main></div>
<script>
const pages=["Overview","Trends","My Crops","Alerts","Settings"];let page="Overview",instant=false,apiOnline=false,csrfToken="",guidedToken="";
const $=s=>document.querySelector(s),entry=$("#entry"),application=$("#application"),view=$("#view");
async function api(path,options={}){const headers={"content-type":"application/json",...(options.headers||{})};if(csrfToken&&options.method&&options.method!=="GET")headers["x-csrf-token"]=csrfToken;if(guidedToken)headers.authorization="Bearer "+guidedToken;const response=await fetch(path,{...options,headers,credentials:"same-origin"});if(response.status===204)return null;const body=await response.json().catch(()=>({}));if(!response.ok)throw Error(body.error||"Request could not be completed");return body;}
function showAuth(mode){const form=$("#authform");form.classList.remove("hide");form.innerHTML=mode==="register"?'<form class="fields"><h2>Create farmer account</h2><label>Full name<input name="name" required autocomplete="name"></label><label>Mobile number<input name="phone" required inputmode="tel" placeholder="+267 71 234 567"></label><label>Password<input name="password" type="password" required minlength="10" autocomplete="new-password"></label><label>Confirm password<input name="confirm" type="password" required minlength="10"></label><p class="muted">No SMS, OTP or PIN is used.</p><div class="error" id="form-error"></div><button class="primary">Create account</button> <button type="button" onclick="showAuth(\'login\')">I already have an account</button></form>':'<form class="fields"><h2>Welcome back</h2><label>Mobile number<input name="phone" required inputmode="tel" autocomplete="tel"></label><label>Password<input name="password" type="password" required autocomplete="current-password"></label><label>Authenticator code (if enabled)<input name="totp" inputmode="numeric"></label><div class="error" id="form-error"></div><button class="primary">Sign in</button> <button type="button" onclick="qrLogin()">Sign in with QR code</button></form>';
form.querySelector("form").onsubmit=async e=>{e.preventDefault();const d=Object.fromEntries(new FormData(e.target));const err=$("#form-error");try{if(mode==="register"){if(d.password!==d.confirm)throw Error("Passwords do not match");await api("/api/account/register",{method:"POST",body:JSON.stringify({name:d.name,phone:d.phone,password:d.password})});showAuth("login");$("#entry-error").textContent="Account created. Sign in with your phone and password.";}else{const result=await api("/api/account/login",{method:"POST",body:JSON.stringify({phone:d.phone,password:d.password,totp:d.totp,client:"web"})});csrfToken=result.csrfToken||"";instant=false;enterApp();}}catch(x){err.textContent=x.message;}}
}
async function instantDemo(){instant=true;guidedToken="";entry.classList.add("hide");application.classList.remove("hide");$("#label").textContent="Demo data · simulated";page="Overview";render();await refreshData();}
async function guidedDemo(){try{const r=await api("/api/demo/start",{method:"POST",body:JSON.stringify({client:"web"})});guidedToken=r.token||"";csrfToken=r.csrfToken||"";instant=false;$("#label").textContent="Demo session · data simulated and temporary";enterApp();}catch(e){alert(e.message);}}
function enterApp(){entry.classList.add("hide");application.classList.remove("hide");render();refreshData();}
function setPage(p){page=p;render();refreshData();}
function render(){const nav=$("#tabs");nav.innerHTML=pages.map(p=>'<button class="'+(page===p?'active':'')+'" onclick="setPage(\''+p+'\')">'+p+'</button>').join("");const body={
"Overview":'<h1>Overview</h1><section class="card"><div class="row"><span class="chip">In range</span><span class="muted">Within configured limits; this does not mean the crop is safe.</span></div><div class="grid"><div>Temperature<div class="metric" id="temp">18.2 °C</div><span class="muted">Low · Target · High</span></div><div>Humidity<div class="metric" id="humidity">62 %</div><span class="muted">Low · Target · High</span></div></div></section><section class="card estimate"><div class="row"><b>Rough storage estimate</b><span class="chip">Estimate</span></div><div class="metric" id="estimate">About 3–5 weeks</div><p class="muted">A rough guess from temperature and humidity only. It does not inspect your crop. Check your crops by hand every few days.</p><button onclick="inspectCrop()">I checked my crop</button> <button onclick="alert('The estimate uses distance from the crop target bands. It ignores moisture, variety, maturity, pests, packaging and ventilation.')">How is this estimated?</button><div id="checked" class="muted"></div></section><section class="card"><h2>Active crop</h2><select id="crop" onchange="refreshData()"><option>Maize</option><option>Sorghum</option><option>Tomato</option><option>Potato</option></select><p class="muted">Recent readings are simulated demo data unless the API labels them otherwise.</p></section>',
"Trends":'<h1>Trends</h1><section class="card"><div class="actions"><button onclick="loadTrends(\'24h\')">24 hours</button><button onclick="loadTrends(\'month\')">1 month</button><button onclick="loadTrends(\'3months\')">3 months</button></div><h2>Temperature (°C)</h2><div id="temp-trend" class="muted">Trend data loads from the backend.</div><h2>Humidity (%)</h2><div id="humidity-trend" class="muted">Threshold bands use the selected crop.</div></section>',
"My Crops":'<h1>My Crops</h1><div id="site-summary" class="card">Counts come from backend records.</div><input id="site-search" class="search" placeholder="Search crop, location or sensor ID" oninput="filterSites()"><div id="sites" class="list"></div><section class="card fields"><h2>Add storage location</h2><label>Location name<input id="site-name"></label><label>Crop<select id="site-crop"><option>Maize</option><option>Sorghum</option><option>Tomato</option><option>Potato</option></select></label><button class="primary" onclick="createSite()">Add storage location</button></section>',
"Alerts":'<h1>Alerts</h1><div class="notice">Alert log. Text messages are not sent in this edition.</div><section class="card"><h2>Needs attention</h2><div id="alerts"></div></section><section class="card"><h2>Alert history</h2><div id="history"></div></section>',
"Settings":'<h1>Settings</h1><section class="card"><h2>Account & security</h2><p>Phone + password account</p><button onclick="loadSessions()">Active sessions</button> <button onclick="enrollTotp()">Authenticator app</button><div id="sessions"></div><h2>Connection</h2><p>Backend address · <span id="backend-state">checking</span></p><h2>Other devices</h2><button onclick="qrPhone()">Connect phone by QR</button> <button onclick="qrLogin()">Log in on computer</button><div id="qr"></div><h2>Data</h2><button onclick="exportReadings()">Export readings</button></section><section class="card"><h2>Demo tools</h2><button onclick="simulateBreach()">Simulate breach</button> <button onclick="guidedDemo()">Start guided demo</button> <button onclick="resetDemo()">Reset demo</button></section><div class="actions"><button class="danger" onclick="signOut()">Sign out</button></div>'
};view.innerHTML=body[page];}
async function refreshData(){if(page==="Overview"){const crop=$("#crop")?.value||"Maize";try{const d=await api("/api/status?crop="+encodeURIComponent(crop));apiOnline=true;if(d.reading){$("#temp").textContent=Number(d.reading.temperature).toFixed(1)+" °C";$("#humidity").textContent=Number(d.reading.humidity).toFixed(0)+" %";}$("#estimate").textContent=d.estimate?.rangeWeeks?"About "+d.estimate.rangeWeeks[0]+"–"+d.estimate.rangeWeeks[1]+" weeks":"Estimate not available while readings are old";$("#sync").textContent="Last synced: "+new Date(d.lastSyncedAt).toLocaleTimeString([],{hour:"2-digit",minute:"2-digit"});$("#backend-state").textContent="Connected";}catch{$("#backend-state").textContent="Unreachable";}}else if(page==="My Crops")loadSites();else if(page==="Alerts")loadAlerts();else if(page==="Trends")loadTrends("24h");}
async function loadSites(){try{const rows=await api("/api/sites");$("#site-summary").textContent=rows.length+" storage locations · "+rows.reduce((n,x)=>n+x.sensors.length,0)+" sensors linked";$("#sites").innerHTML=rows.map(x=>'<article class="card site" data-search="'+(x.crop+" "+x.name+" "+x.sensors.map(s=>s.id).join(" ")).toLowerCase()+'"><div class="row"><b>'+escapeHtml(x.crop+" · "+x.name)+'</b><button onclick="deleteSite(\''+x.id+'\')">Delete location</button></div>'+x.sensors.map(s=>'<div class="sensor">'+escapeHtml(s.id)+' · '+(s.last_seen_at||"No recent reading")+' <button onclick="unlinkSensor(\''+x.id+'\',\''+s.id+'\')">Unlink</button></div>').join('')+'</article>').join('')||'<div class="card">No storage locations yet</div>';}catch(e){$("#sites").innerHTML='<div class="card">'+escapeHtml(e.message)+'</div>';}}
async function createSite(){try{await api("/api/sites",{method:"POST",body:JSON.stringify({name:$("#site-name").value,crop:$("#site-crop").value})});await loadSites();}catch(e){alert(e.message);}}
async function deleteSite(id){if(!confirm("Delete this storage location?"))return;await api("/api/sites/"+id,{method:"DELETE"});loadSites();}
async function unlinkSensor(id,sensor){await api("/api/sites/"+id+"/sensors/"+encodeURIComponent(sensor),{method:"DELETE"});loadSites();}
function filterSites(){const q=$("#site-search").value.toLowerCase();document.querySelectorAll(".site").forEach(x=>x.classList.toggle("hide",!x.dataset.search.includes(q)));}
async function loadAlerts(){try{const rows=await api("/api/alerts");$("#alerts").innerHTML=rows.filter(x=>!x.reviewed_at).map(x=>'<p>'+escapeHtml(x.message)+' <button onclick="reviewAlert(\''+x.id+'\')">Mark as reviewed</button> <span class="chip">SMS not sent</span></p>').join('')||"No alerts need attention.";$("#history").innerHTML=rows.filter(x=>x.reviewed_at).map(x=>'<p>'+escapeHtml(x.message)+' · Reviewed</p>').join('')||"No alert history.";}catch(e){$("#alerts").textContent=e.message;}}
async function reviewAlert(id){await api("/api/alerts/"+id+"/review",{method:"POST",body:"{}"});loadAlerts();}
async function loadTrends(range){try{const d=await api("/api/readings/trends?range="+range);$("#temp-trend").textContent=d.points.length+" temperature readings · "+range;$("#humidity-trend").textContent=d.points.length+" humidity readings · "+range;}catch(e){$("#temp-trend").textContent=e.message;}}
async function inspectCrop(){if(instant&&!guidedToken){$("#checked").textContent="Last checked by you: today, just now";return;}try{const sites=await api("/api/sites");if(sites[0]){const x=await api("/api/sites/"+sites[0].id+"/inspect",{method:"POST",body:"{}"});$("#checked").textContent="Last checked by you: "+new Date(x.lastInspectedAt).toLocaleString();}}catch(e){alert(e.message);}}
async function loadSessions(){try{const rows=await api("/api/account/sessions");$("#sessions").innerHTML=rows.map(s=>'<p>'+s.kind+' · expires '+s.expires_at+' <button onclick="revokeSession(\''+s.token_hash+'\')">Revoke</button></p>').join('')+'<button onclick="api(\'/api/account/sessions/revoke-all\',{method:\'POST\',body:\'{}\'}).then(loadSessions)">Sign out everywhere</button>';}catch(e){$("#sessions").textContent=e.message;}}
async function revokeSession(id){await api("/api/account/sessions/"+id,{method:"DELETE"});loadSessions();}
async function enrollTotp(){try{const x=await api("/api/account/totp/enroll",{method:"POST",body:"{}"});alert("Authenticator setup key (store securely): "+x.secret+"\\nAdd it to your authenticator app, then confirm with a current code.");}catch(e){alert(e.message);}}
async function exportReadings(){try{const r=await fetch("/api/export",{credentials:"same-origin"}),blob=await r.blob(),a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="peo-yame-readings.csv";a.click();URL.revokeObjectURL(a.href);}catch(e){alert(e.message);}}
async function simulateBreach(){if(guidedToken){try{await api("/api/demo/simulate-reading",{method:"POST",body:JSON.stringify({temperature:33,humidity:88,sensorId:"PY-DEMO-1"})});}catch(e){alert(e.message);}}else alert("Simulated breach is available in Guided demo.");}
async function resetDemo(){if(!guidedToken)return;try{await api("/api/demo/reset",{method:"POST",body:"{}"});guidedToken="";instantDemo();}catch(e){alert(e.message);}}
async function qrLogin(){const verifier=crypto.getRandomValues(new Uint8Array(32));const code=Array.from(verifier,x=>x.toString(16).padStart(2,"0")).join("");try{const r=await api("/api/qr/web/create",{method:"POST",body:JSON.stringify({verifier:code})});$("#entry-error").textContent="QR request "+r.codeId+" · match number "+r.matchCode+" · expires in 90 seconds";}catch(e){$("#entry-error").textContent=e.message;}}
async function qrPhone(){try{const r=await api("/api/qr/phone/create",{method:"POST",body:JSON.stringify({password:prompt("Confirm your password to connect a phone")||""})});$("#qr").textContent="Pairing code "+r.codeId+" · expires in 90 seconds";}catch(e){alert(e.message);}}
async function signOut(){try{await api("/api/account/logout",{method:"POST",body:"{}"});}catch{}guidedToken="";csrfToken="";instant=false;application.classList.add("hide");entry.classList.remove("hide");}
function escapeHtml(s){return String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));}
if(window.EventSource){const events=new EventSource("/api/events");for(const name of ["reading","crop-selection","alert","account","session"])events.addEventListener(name,()=>refreshData());}
</script></body></html>
