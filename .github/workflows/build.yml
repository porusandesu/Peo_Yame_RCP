name: Peo Yame build
run-name: Peo Yame v${{ github.run_number }} — Windows launch validation
on:
  push:
    branches: [exe-work]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: peo-yame-launch-validation
  cancel-in-progress: false
jobs:
  backend:
    name: Backend API tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install and test API
        working-directory: backend
        run: |
          npm install
          npm test
  android:
    name: Android APK with Peo Yame launcher icon
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Generate Android project and install launcher assets
        working-directory: mobile
        run: |
          flutter create --platforms=android --org com.peoyame --project-name monitor .
          python3 android-configure.py
          mkdir -p android/app/src/main/res/drawable
          cp ../assets/peo-yame-512.png android/app/src/main/res/drawable/peo_yame_logo.png
          grep -q 'android:icon="@mipmap/ic_launcher"' android/app/src/main/AndroidManifest.xml
          test -f android/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png
          test -f android/app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml
      - name: Test, analyze, build APK, and verify packaged launcher icons
        working-directory: mobile
        run: |
          flutter pub get
          flutter test
          flutter analyze --no-fatal-infos
          flutter build apk --release
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          ls -la build/app/outputs/flutter-apk/
          "$BT/aapt2" dump badging build/app/outputs/flutter-apk/app-release.apk | grep -iE "application|icon"
          "$BT/aapt2" dump resources build/app/outputs/flutter-apk/app-release.apk > resources-dump.txt
          grep -iE "mipmap/ic_launcher" resources-dump.txt -A6 -B4 > launcher-resources.txt || true
          cat launcher-resources.txt
          grep -iE "xxxhdpi" launcher-resources.txt
          grep -iE "anydpi" launcher-resources.txt
          grep -qiE "mipmap/ic_launcher_round" resources-dump.txt
      - run: cp mobile/build/app/outputs/flutter-apk/app-release.apk "Peo Yame v${{ github.run_number }}.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: Peo Yame v${{ github.run_number }} Android
          path: Peo Yame v${{ github.run_number }}.apk
          if-no-files-found: error
          compression-level: 0
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Install backend dependencies
        working-directory: backend
        run: npm install
      - name: Embed backend and icon
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path runtime/src, runtime/public, runtime/node_modules | Out-Null
          Copy-Item backend/src/server.js runtime/src/server.js
          Copy-Item backend/public/* runtime/public -Recurse -Force
          Copy-Item backend/node_modules/* runtime/node_modules -Recurse -Force
          Copy-Item (Get-Command node).Source runtime/node.exe
          Compress-Archive -Path runtime/* -DestinationPath PeoYame.bundle.zip -Force
          if ((Get-Item windows/assets/PeoYame.ico).Length -lt 1024) { throw "Approved Windows icon missing." }
      - name: Publish single-file Windows app
        shell: pwsh
        run: |
          $bundle = (Resolve-Path PeoYame.bundle.zip).Path
          $icon = (Resolve-Path windows/assets/PeoYame.ico).Path
          dotnet publish windows/PeoYameTray.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:BuildNumber=${{ github.run_number }} "-p:PeoYameBundlePath=$bundle" "-p:PeoYameIconPath=$icon" -o publish
      - name: Launch normal app from isolated executable and verify service
        shell: pwsh
        run: |
          $root = Join-Path $env:RUNNER_TEMP "peoyame-launch"
          $data = Join-Path $env:RUNNER_TEMP "peoyame-launch-data"
          $exe = Join-Path $root "Peo Yame.exe"
          $trace = Join-Path $root "launch.log"
          New-Item -ItemType Directory -Force -Path $root, $data | Out-Null
          Copy-Item "publish/Peo Yame.exe" $exe
          if (@(Get-ChildItem $root -Force).Count -ne 1) { throw "Isolated launch folder must contain only the executable." }
          Add-Type -AssemblyName System.Drawing
          $icon = [System.Drawing.Icon]::ExtractAssociatedIcon($exe)
          if ($null -eq $icon) { throw "Windows executable icon is missing." }
          $icon.Dispose()
          $env:PEO_YAME_DATA_DIR = $data
          $env:PEO_YAME_SELF_TEST_LOG = $trace
          $env:PEO_YAME_NO_BROWSER = "true"
          $env:PORT = "31886"
          $app = Start-Process -FilePath $exe -WorkingDirectory $root -PassThru
          try {
            $ok = $false
            for ($i = 0; $i -lt 60; $i++) {
              if ($app.HasExited) { break }
              try {
                $health = Invoke-RestMethod "http://127.0.0.1:31886/api/health" -TimeoutSec 2
                $page = Invoke-WebRequest "http://127.0.0.1:31886/" -TimeoutSec 2
                if ($health.ok -and $page.Content.Contains("<title>Peo Yame</title>")) { $ok = $true; break }
              } catch {}
              Start-Sleep 1
            }
            if (!$ok) {
              if (Test-Path $trace) { Get-Content $trace }
              $log = Join-Path $data "logs/app.log"
              if (Test-Path $log) { Get-Content $log }
              throw "Normal Windows launch did not bring up backend/dashboard."
            }
            $traceOk = $false
            for ($i = 0; $i -lt 20 -and !$traceOk; $i++) {
              if (Test-Path $trace) { $traceOk = (Get-Content $trace -Raw).Contains("Dashboard launch target: http://127.0.0.1:31886/") }
              if (!$traceOk) { Start-Sleep -Milliseconds 500 }
            }
            if (!$traceOk) {
              if (Test-Path $trace) { Write-Host "--- launch trace ---"; Get-Content $trace }
              $log = Join-Path $data "logs/app.log"
              if (Test-Path $log) { Write-Host "--- app log ---"; Get-Content $log }
              throw "Dashboard launch not requested."
            }
            $body = @{ name="Windows Launch Check"; phone="71234567"; password="windows-launch-check-password" } | ConvertTo-Json
            $account = Invoke-RestMethod "http://127.0.0.1:31886/api/account/register" -Method Post -ContentType "application/json" -Body $body
            if (!$account.token) { throw "Windows account registration failed." }
            Write-Host "WINDOWS_NORMAL_LAUNCH_OK"
          } finally {
            if (!$app.HasExited) { Stop-Process -Id $app.Id -Force -ErrorAction SilentlyContinue }
            Get-CimInstance Win32_Process | Where-Object { $_.Name -eq "node.exe" -and $_.CommandLine -like "*src/server.js*" } | ForEach-Object { Stop-Process -Id $_.ProcessId -Force -ErrorAction SilentlyContinue }
          }
      - name: Verify backend restart/reset lifecycle
        shell: pwsh
        run: |
          $env:PEO_YAME_DATA_DIR = Join-Path $env:RUNNER_TEMP "peoyame-self-test"
          $env:PEO_YAME_SELF_TEST_LOG = Join-Path $env:RUNNER_TEMP "peoyame-self-test.log"
          $env:PEO_YAME_NO_BROWSER = "true"
          $env:PORT = "31887"
          $test = Start-Process -FilePath "publish/Peo Yame.exe" -WorkingDirectory (Get-Location).Path -ArgumentList "--self-test" -PassThru -Wait
          if ($test.ExitCode -ne 0) { if (Test-Path $env:PEO_YAME_SELF_TEST_LOG) { Get-Content $env:PEO_YAME_SELF_TEST_LOG }; throw "Backend lifecycle test failed." }
          Copy-Item "publish/Peo Yame.exe" "publish/Peo Yame v${{ github.run_number }}.exe"
      - uses: actions/upload-artifact@v4
        with:
          name: Peo Yame v${{ github.run_number }} Windows
          path: publish/Peo Yame v${{ github.run_number }}.exe
          if-no-files-found: error
          compression-level: 0
