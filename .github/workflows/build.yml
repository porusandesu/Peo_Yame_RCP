name: Peo Yame build
run-name: Peo Yame v${{ github.run_number }}
on:
  push:
    branches: [exe-work]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: peo-yame-build
  cancel-in-progress: false
jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install and test API
        working-directory: backend
        run: |
          npm install
          npm test
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Generate Android project
        working-directory: mobile
        run: flutter create --platforms=android --org com.peoyame --project-name monitor .
      - name: Configure demo LAN access and brand icon
        working-directory: mobile
        run: |
          python3 android-configure.py
          mkdir -p android/app/src/main/res/drawable
          cp ../assets/peo-yame-512.png android/app/src/main/res/drawable/peo_yame_logo.png
      - name: Test and analyze Android client
        working-directory: mobile
        run: |
          flutter pub get
          flutter test
          flutter analyze --no-fatal-infos
      - name: Build Android release
        working-directory: mobile
        run: flutter build apk --release
      - name: Name Android release
        run: cp mobile/build/app/outputs/flutter-apk/app-release.apk "Peo Yame v${{ github.run_number }}.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: Peo Yame v${{ github.run_number }} Android
          path: Peo Yame v${{ github.run_number }}.apk
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Install backend dependencies and test
        working-directory: backend
        run: |
          npm install
          npm test
      - name: Publish notification-area app
        run: dotnet publish windows/PeoYameTray.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -o publish
      - name: Package backend and logo
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path publish/backend, publish/backend/src, publish/backend/public, publish/assets | Out-Null
          Copy-Item backend/src/server.js publish/backend/src/server.js
          Copy-Item backend/package.json publish/backend/package.json
          Copy-Item backend/public/* publish/backend/public -Recurse -Force
          Copy-Item backend/node_modules publish/backend/node_modules -Recurse -Force
          Copy-Item assets/peo-yame-512.png publish/backend/public/assets/peo-yame-512.png -Force
          Copy-Item assets/peo-yame-512.png publish/assets/peo-yame-512.png
          Add-Type -AssemblyName System.Drawing
          $brand = [System.Drawing.Image]::FromFile((Resolve-Path "assets/peo-yame-512.png"))
          $iconHandle = $brand.GetHicon()
          $icon = [System.Drawing.Icon]::FromHandle($iconHandle)
          $iconStream = [System.IO.File]::Create("publish/PeoYame.ico")
          $icon.Save($iconStream)
          $iconStream.Dispose()
          $icon.Dispose()
          $brand.Dispose()
          Copy-Item (Get-Command node).Source publish/backend/node.exe
          $env:PEO_YAME_DATA_DIR = Join-Path $env:RUNNER_TEMP "peo-yame-lifecycle"
          $env:PORT = "38191"
          & "publish/Peo Yame.exe" --self-test
          if ($LASTEXITCODE -ne 0) { throw "Windows backend lifecycle check failed" }
          Copy-Item "publish/Peo Yame.exe" "publish/Peo Yame v${{ github.run_number }}.exe"
          Compress-Archive -Path publish/* -DestinationPath "Peo Yame v${{ github.run_number }} Windows.zip" -Force
      - uses: actions/upload-artifact@v4
        with:
          name: Peo Yame v${{ github.run_number }} Windows
          path: Peo Yame v${{ github.run_number }} Windows.zip
