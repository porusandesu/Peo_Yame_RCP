name: Peo Yame build
run-name: Peo Yame v${{ github.run_number }}
on:
  push:
    branches: [exe-work]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: peo-yame-build
  cancel-in-progress: false
jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm test
  android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter create --platforms=android --org bw.co.peoyame --project-name peo_yame .
      - name: Configure camera and local authentication
        shell: bash
        run: |
          python3 -c 'from pathlib import Path; p=Path("android/app/src/main/AndroidManifest.xml"); s=p.read_text(); s=s.replace("<application", "<uses-permission android:name=\\\"android.permission.CAMERA\\\" />\\n    <application android:usesCleartextTraffic=\\\"true\\\" android:allowBackup=\\\"false\\\"", 1); p.write_text(s)'
          find android/app/src/main/kotlin -name MainActivity.kt -exec sed -i 's/io.flutter.embedding.android.FlutterActivity/io.flutter.embedding.android.FlutterFragmentActivity/g;s/FlutterActivity/FlutterFragmentActivity/g' {} +
      - name: Install supplied Android launcher icons
        shell: bash
        run: |
          for density in mdpi hdpi xhdpi xxhdpi xxxhdpi; do mkdir -p android/app/src/main/res/mipmap-$density; cp ../assets/android/mipmap-$density/ic_launcher*.png android/app/src/main/res/mipmap-$density/; done
          mkdir -p android/app/src/main/res/drawable
          cp ../assets/android/drawable/* android/app/src/main/res/drawable/
          mkdir -p android/app/src/main/res/mipmap-anydpi-v26
          cp ../assets/android/mipmap-anydpi-v26/ic_launcher.xml android/app/src/main/res/mipmap-anydpi-v26/
      - run: flutter pub get
      - run: flutter test
      - run: flutter analyze --fatal-infos
      - run: flutter build apk --release
      - name: Name APK from this workflow run
        shell: bash
        run: cp build/app/outputs/flutter-apk/app-release.apk "Peo Yame v${GITHUB_RUN_NUMBER}.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: Peo Yame v${{ github.run_number }}
          path: mobile/Peo Yame v${{ github.run_number }}.apk
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Install and test backend
        working-directory: backend
        run: |
          npm install
          npm test
      - name: Publish tray application
        run: dotnet publish windows/PeoYameTray.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -o publish
      - name: Package backend runtime and assets
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path publish/backend | Out-Null
          Copy-Item backend/src -Destination publish/backend/src -Recurse
          Copy-Item backend/public -Destination publish/backend/public -Recurse
          Copy-Item backend/package.json -Destination publish/backend/package.json
          Copy-Item backend/node_modules -Destination publish/backend/node_modules -Recurse
          $node = (Get-Command node).Source
          Copy-Item $node publish/backend/node.exe
          Copy-Item assets/windows/PeoYame.png publish/PeoYame.png
          $env:PEO_YAME_DATA_DIR = Join-Path $env:RUNNER_TEMP "peo-yame-lifecycle-data"
          $env:PORT = "38191"
          $env:PEO_YAME_SELF_TEST_LOG = Join-Path $env:RUNNER_TEMP "peo-yame-self-test.log"
          $proc = Start-Process -FilePath "publish/Peo Yame.exe" -ArgumentList "--self-test" -Wait -PassThru
          if ($proc.ExitCode -ne 0) {
            if (Test-Path $env:PEO_YAME_SELF_TEST_LOG) { Get-Content $env:PEO_YAME_SELF_TEST_LOG }
            $fallbackLog = Join-Path $env:TEMP "PeoYame-self-test.log"
            if (Test-Path $fallbackLog) { Get-Content $fallbackLog }
            throw "Tray start/restart/stop lifecycle self-test failed."
          }
          Copy-Item "publish/Peo Yame.exe" "publish/Peo Yame v${{ github.run_number }}.exe"
          Compress-Archive -Path publish/* -DestinationPath "Peo Yame v${{ github.run_number }} Windows.zip" -Force
      - uses: actions/upload-artifact@v4
        with:
          name: Peo Yame v${{ github.run_number }} Windows
          path: Peo Yame v${{ github.run_number }} Windows.zip
