name: Peo Yame build
run-name: Peo Yame v${{ github.run_number }}
on:
  push:
    branches: [exe-work]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: peo-yame-build
  cancel-in-progress: false
jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install and test API
        working-directory: backend
        run: |
          npm install
          npm test
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Generate Android project
        working-directory: mobile
        run: flutter create --platforms=android --org com.peoyame --project-name monitor .
      - name: Configure demo LAN access and brand icon
        working-directory: mobile
        run: |
          python3 android-configure.py
          mkdir -p android/app/src/main/res/drawable
          cp ../assets/peo-yame-512.png android/app/src/main/res/drawable/peo_yame_logo.png
      - name: Test and analyze Android client
        working-directory: mobile
        run: |
          flutter pub get
          flutter test
          flutter analyze --no-fatal-infos
      - name: Build Android release
        working-directory: mobile
        run: flutter build apk --release
      - name: Name Android release
        run: cp mobile/build/app/outputs/flutter-apk/app-release.apk "Peo Yame v${{ github.run_number }}.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: Peo Yame v${{ github.run_number }} Android
          path: Peo Yame v${{ github.run_number }}.apk
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Install backend dependencies and test
        working-directory: backend
        run: |
          npm install
          npm test
      - name: Embed backend runtime and brand assets
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path runtime/src, runtime/public, runtime/node_modules | Out-Null
          Copy-Item backend/src/server.js runtime/src/server.js
          Copy-Item backend/public/* runtime/public -Recurse -Force
          Copy-Item assets/peo-yame-512.png runtime/public/assets/peo-yame-512.png -Force
          Copy-Item backend/node_modules/* runtime/node_modules -Recurse -Force
          Copy-Item (Get-Command node).Source runtime/node.exe
          Compress-Archive -Path runtime/* -DestinationPath PeoYame.bundle.zip -Force
          Add-Type -AssemblyName System.Drawing
          $brand = [System.Drawing.Image]::FromFile((Resolve-Path "assets/peo-yame-512.png"))
          $iconHandle = $brand.GetHicon()
          $icon = [System.Drawing.Icon]::FromHandle($iconHandle)
          $iconStream = [System.IO.File]::Create("PeoYame.ico")
          $icon.Save($iconStream)
          $iconStream.Dispose()
          $icon.Dispose()
          $brand.Dispose()
      - name: Publish one-file app
        run: dotnet publish windows/PeoYameTray.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:BuildNumber=${{ github.run_number }} -p:PeoYameBundlePath=PeoYame.bundle.zip -p:PeoYameIconPath=PeoYame.ico -o publish
      - name: Verify standalone executable startup and package artifact
        shell: pwsh
        run: |
          $env:PEO_YAME_DATA_DIR = Join-Path $env:RUNNER_TEMP "peo-yame-lifecycle"
          $env:PEO_YAME_SELF_TEST_LOG = Join-Path $env:RUNNER_TEMP "peo-yame-self-test.log"
          if (Test-Path "publish/backend") { throw "Backend files must be embedded in the standalone executable." }
          $standalone = Join-Path $env:RUNNER_TEMP "peoyame-standalone"
          New-Item -ItemType Directory -Force -Path $standalone | Out-Null
          Copy-Item "publish/Peo Yame.exe" (Join-Path $standalone "Peo Yame.exe")
          $selfTest = Start-Process -FilePath (Join-Path $standalone "Peo Yame.exe") -WorkingDirectory $standalone -ArgumentList "--self-test" -PassThru -Wait
          if ($selfTest.ExitCode -ne 0) {
            if (Test-Path $env:PEO_YAME_SELF_TEST_LOG) { Get-Content $env:PEO_YAME_SELF_TEST_LOG }
            $testFile = Join-Path $env:TEMP "PeoYame-self-test.log"
            if (Test-Path $testFile) { Get-Content $testFile }
            Get-ChildItem $env:TEMP -Filter "self-test.log" -Recurse -ErrorAction SilentlyContinue | ForEach-Object { Get-Content $_.FullName }
            throw "Windows backend lifecycle check failed"
          }
          Copy-Item "publish/Peo Yame.exe" "publish/Peo Yame v${{ github.run_number }}.exe"
      - uses: actions/upload-artifact@v4
        with:
          name: Peo Yame v${{ github.run_number }} Windows
          path: publish/Peo Yame v${{ github.run_number }}.exe
