name: peo_yame_debug

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install Flutter dependencies
        run: flutter pub get

      - name: Run Flutter widget tests
        run: flutter test

      - name: Analyze Dart code
        run: flutter analyze --no-fatal-infos lib test

      - name: Build Android APK
        run: flutter build apk --debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: storage-monitor-android-debug
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 14

  backend-checks:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install backend dependencies
        run: npm ci

      - name: Install SQLite CLI for backend integration tests
        run: |
          sudo apt-get update
          sudo apt-get install -y sqlite3

      - name: Check backend JavaScript syntax
        run: npm run check

      - name: Test backend and web demo entry
        run: npm test

  windows-backend:
    runs-on: windows-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install backend dependencies
        run: npm ci

      - name: Install SQLite CLI for backend integration tests
        shell: pwsh
        run: |
          $archive = Join-Path $env:RUNNER_TEMP "sqlite-tools.zip"
          $directory = Join-Path $env:RUNNER_TEMP "sqlite-tools"
          Invoke-WebRequest -Uri "https://www.sqlite.org/2025/sqlite-tools-win-x64-3500400.zip" -OutFile $archive
          Expand-Archive -Path $archive -DestinationPath $directory -Force
          $sqlite = Get-ChildItem -Path $directory -Filter "sqlite3.exe" -Recurse | Select-Object -First 1
          if (-not $sqlite) { throw "sqlite3.exe was not found in the SQLite tools archive." }
          "SQLITE3_PATH=$($sqlite.FullName)" >> $env:GITHUB_ENV

      - name: Test backend and web demo entry on Windows
        run: npm test

      - name: Package standalone backend with system tray launcher
        run: npm run build:windows

      - name: Upload Windows app
        uses: actions/upload-artifact@v4
        with:
          name: peo-yame-backend-windows
          path: backend/dist/Peo-Yame-Backend.zip
          if-no-files-found: error
          retention-days: 30
